name: Build and publish image

on:
  schedule:
    # quay.io/containers/aio publishes dated tags weekly; check after the
    # usual Wednesday release window.
    - cron: "0 19 * * 3"
  workflow_dispatch:
    inputs:
      aio_tag:
        description: "aio base image tag (blank selects the newest dated tag)"
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.aio.outputs.tag }}
      image: ${{ steps.aio.outputs.image }}
      should_build: ${{ steps.aio.outputs.should_build }}
    steps:
      - name: Select aio tag
        id: aio
        env:
          AIO_TAG_INPUT: ${{ inputs.aio_tag }}
        run: |
          if [[ -n "$AIO_TAG_INPUT" ]]; then
            tag="$AIO_TAG_INPUT"
          else
            tag=$(curl --fail --silent --show-error \
              'https://quay.io/api/v1/repository/containers/aio/tag/?limit=100' \
              | jq -r '[.tags[] | select(.name | test("^v[0-9]{4}\\.[0-9]{2}\\.[0-9]{2}$"))] | max_by(.start_ts).name')
          fi
          if [[ ! "$tag" =~ ^v[0-9]{4}\.[0-9]{2}\.[0-9]{2}$ ]]; then
            echo "Invalid or unavailable aio tag: $tag" >&2
            exit 1
          fi
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          should_build=true
          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]] && docker manifest inspect "$image:$tag" >/dev/null 2>&1; then
            echo "GHCR already contains $image:$tag; skipping scheduled build."
            should_build=false
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "should_build=$should_build" >> "$GITHUB_OUTPUT"

  build-and-publish:
    needs: resolve
    if: needs.resolve.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ./Containerfile
          build-args: |
            AIO_TAG=${{ steps.aio.outputs.tag }}
          push: true
          tags: |
            ${{ needs.resolve.outputs.image }}:${{ needs.resolve.outputs.tag }}
            ${{ needs.resolve.outputs.image }}:latest
