name: Build and publish image

on:
  schedule:
    # quay.io/containers/aio publishes dated tags weekly; check after the
    # usual Wednesday release window.
    - cron: "0 19 * * 3"
  workflow_dispatch:
    inputs:
      aio_tag:
        description: "aio base image tag (blank selects the newest dated tag)"
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select aio tag
        id: aio
        env:
          AIO_TAG_INPUT: ${{ inputs.aio_tag }}
        run: |
          if [[ -n "$AIO_TAG_INPUT" ]]; then
            tag="$AIO_TAG_INPUT"
          else
            tag=$(curl --fail --silent --show-error \
              'https://quay.io/api/v1/repository/containers/aio/tag/?limit=100' \
              | jq -r '[.tags[] | select(.name | test("^v[0-9]{4}\\.[0-9]{2}\\.[0-9]{2}$"))] | max_by(.start_ts).name')
          fi
          if [[ ! "$tag" =~ ^v[0-9]{4}\.[0-9]{2}\.[0-9]{2}$ ]]; then
            echo "Invalid or unavailable aio tag: $tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          build-args: |
            AIO_TAG=${{ steps.aio.outputs.tag }}
          push: true
          tags: |
            ${{ steps.aio.outputs.image }}:${{ steps.aio.outputs.tag }}
            ${{ steps.aio.outputs.image }}:latest
